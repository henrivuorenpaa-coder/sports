<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sports</title>
<meta name="description" content="Henkilökohtainen valmentaja: harjoitusohjelmat, juoksu ja taekwondo samassa kalenterissa.">
<meta name="theme-color" content="#D9461F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sports">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&family=Barlow:wght@400;500;600;700&display=swap">
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><h1>Sports</h1><span class="sync" id="sync">Ladataan…</span></div>
    <nav class="topnav" id="topnav" aria-label="Näkymät">
      <button data-go="calendar">Kalenteri</button>
      <button data-go="plan">Ohjelma</button>
      <button data-go="coach">Valmentaja</button>
      <button data-go="prefs">Asetukset</button>
    </nav>
  </div>
</header>

<main class="app">
  <section class="view" id="v-today" aria-label="Tänään"></section>
  <section class="view" id="v-calendar" aria-label="Kalenteri" hidden></section>
  <section class="view" id="v-plan" aria-label="Ohjelma" hidden></section>
  <section class="view" id="v-coach" aria-label="Valmentaja" hidden></section>
  <section class="view" id="v-prefs" aria-label="Asetukset" hidden></section>
</main>

<nav class="bottomnav" id="bottomnav" aria-label="Näkymät">
  <button data-go="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>Tänään</button>
  <button data-go="plan"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 9h6M9 13h6M9 17h4"/></svg>Ohjelma</button>
  <button data-go="calendar"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Kalenteri</button>
  <button data-go="coach"><svg viewBox="0 0 24 24"><path d="M5 19V11M12 19V5M19 19v-6"/></svg>Valmentaja</button>
  <button data-go="prefs"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>Asetukset</button>
</nav>

<div id="sheet-root"></div>
<div id="toast-root"></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
