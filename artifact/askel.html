<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Askel 5K</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone = one view + bottom tab bar; desktop = "today" column pinned left, selected view on the right.
   Look: running-track red on ink navy, lane lines on the hero, condensed italic display type. */
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --surface-2:#ECEEF4; --fg:#121829; --muted:#5A6377; --line:#DCE0EA;
  --run:#CF4220; --run-fill:#D9461F; --run-soft:#FCE7E0; --walk:#C3C9D6; --stride:#8E2A12;
  --tkd:#2C63D6; --tkd-fill:#2F6BE0; --tkd-soft:#E2EAFC; --other:#1B8576; --other-soft:#DDF1EE;
  --warn:#9A5B00; --warn-soft:#FBF0D9; --ok:#1C7548; --ok-soft:#DCF0E5;
  --on-fill:#FFFFFF;
  --hero-a:#EA5730; --hero-b:#AE301A; --on-hero:#FFFFFF; --on-hero-dim:rgb(255 255 255 / .8);
  --hero-lane:rgb(255 255 255 / .17); --hero-walk:rgb(255 255 255 / .3); --hero-chip:rgb(255 255 255 / .22);
  --shadow:0 1px 2px rgb(18 24 41 / .05), 0 10px 28px rgb(18 24 41 / .07);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0E19; --surface:#131928; --surface-2:#1D2537; --fg:#EEF1F8; --muted:#98A2B9; --line:#27304A;
  --run:#FF7B57; --run-fill:#D9461F; --run-soft:#3A1D15; --walk:#3B455C; --stride:#FFC4B1;
  --tkd:#82A9FF; --tkd-fill:#2F6BE0; --tkd-soft:#18264A; --other:#5CD2BF; --other-soft:#12332F;
  --warn:#F2B544; --warn-soft:#37290F; --ok:#62CC95; --ok-soft:#133226;
  --shadow:0 0 0 rgb(0 0 0 / 0); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0E19; --surface:#131928; --surface-2:#1D2537; --fg:#EEF1F8; --muted:#98A2B9; --line:#27304A;
  --run:#FF7B57; --run-fill:#D9461F; --run-soft:#3A1D15; --walk:#3B455C; --stride:#FFC4B1;
  --tkd:#82A9FF; --tkd-fill:#2F6BE0; --tkd-soft:#18264A; --other:#5CD2BF; --other-soft:#12332F;
  --warn:#F2B544; --warn-soft:#37290F; --ok:#62CC95; --ok-soft:#133226;
  --shadow:0 0 0 rgb(0 0 0 / 0); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;line-height:1.05;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,summary:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--run);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:14px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:16px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand h1{font-size:28px;font-style:italic;font-weight:800;text-transform:uppercase;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand h1::before{content:"";width:26px;height:26px;border-radius:8px;flex:none;
  background:repeating-radial-gradient(circle at 100% 100%, transparent 0 6px, var(--hero-lane) 6px 8px), linear-gradient(135deg,var(--hero-a),var(--hero-b))}
.brand h1 b{color:var(--run);font-weight:800}
.sync{font-size:12px;font-weight:600;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:3px 10px 3px 8px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
.topnav{display:none;gap:2px;background:var(--surface-2);border-radius:999px;padding:4px}
.topnav button{border:0;background:none;padding:7px 16px;border-radius:999px;font-weight:600;font-size:15px;color:var(--muted)}
.topnav button:hover{color:var(--fg)}
.topnav button[aria-current="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgb(0 0 0 / .12)}

/* layout */
.app{max-width:1240px;margin:0 auto;padding-block:20px calc(92px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:flex;flex-direction:column;gap:16px;min-width:0}
.view-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.view-head h2{font-size:38px;font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:0}
@media (min-width:960px){
  .topnav{display:flex}
  .bottomnav{display:none!important}
  .app{display:grid;grid-template-columns:minmax(330px,390px) minmax(0,1fr);gap:32px;align-items:start;padding-block:28px 48px}
  #v-today{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.card > h3{font-size:24px}

/* hero: track-red band with lane lines, neutral body below */
.hero{padding:0;gap:0;overflow:hidden;border:0}
.hero-top{position:relative;isolation:isolate;color:var(--on-hero);padding:18px 18px 20px;display:flex;flex-direction:column;gap:14px;
  background:linear-gradient(135deg,var(--hero-a),var(--hero-b))}
.hero-top::after{content:"";position:absolute;inset:0;z-index:-1;
  background:repeating-radial-gradient(circle at 112% 150%, transparent 0 36px, var(--hero-lane) 36px 38px)}
.hero-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r)}
.hero .when{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero h3{font-size:36px;font-style:italic;font-weight:800;text-transform:uppercase;overflow-wrap:anywhere}
.hero .meta{display:flex;gap:22px;flex-wrap:wrap}
.hero-top .label{color:var(--on-hero-dim)}
.hero-top .chip.next,.hero-top .chip.today{background:var(--hero-chip);color:var(--on-hero)}
.metric{display:flex;flex-direction:column;gap:2px}
.metric .v{font-family:var(--display);font-size:32px;font-weight:700;font-style:italic;line-height:1}
.metric .v small{font-size:16px;font-weight:600;font-style:normal;color:var(--muted);margin-left:3px}
.hero-top .metric .v small{color:var(--on-hero-dim)}

/* structure bar */
.bar{display:flex;gap:2px;height:12px;border-radius:999px;overflow:hidden;width:100%}
.bar.big{height:26px;border-radius:8px;gap:3px}
.bar.thin{height:5px;gap:1px}
.bar span{display:block;min-width:2px}
.bar.big span{border-radius:3px}
.bar.thin span{min-width:1px}
.bar .run{background:var(--run)}
.bar .walk{background:var(--walk)}
.bar .stride{background:var(--stride)}
.bar .test{background:repeating-linear-gradient(45deg,var(--run) 0 6px,var(--stride) 6px 12px)}
.hero-top .bar .run{background:var(--on-hero)}
.hero-top .bar .walk{background:var(--hero-walk)}
.hero-top .bar .stride{background:var(--on-hero-dim)}
.hero-top .bar .test{background:repeating-linear-gradient(45deg,var(--on-hero) 0 6px,var(--hero-walk) 6px 12px)}
.legend{display:flex;gap:12px;font-size:12.5px;font-weight:500;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.steps li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;padding:7px 0;position:relative;font-weight:500}
.steps li::before{content:"";width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--walk);position:relative;z-index:1}
.steps li.r::before{background:var(--run)}
.steps li:not(:last-child)::after{content:"";position:absolute;left:4px;top:18px;bottom:-6px;width:2px;background:var(--line)}

/* notes */
.note{border-radius:12px;padding:11px 13px;font-size:14.5px;display:flex;gap:10px;align-items:flex-start}
.note b{font-weight:700}
.note.warn{background:var(--warn-soft)}
.note.warn::before{content:"!";flex:none;width:20px;height:20px;border-radius:50%;background:var(--warn);color:var(--surface);font-weight:700;font-size:13px;display:grid;place-items:center}
.note.tkd{background:var(--tkd-soft)}
.note.tkd::before{content:"";flex:none;width:12px;height:12px;margin-top:4px;border-radius:4px;background:var(--tkd)}
.note.ok{background:var(--ok-soft)}
.note.ok::before{content:"✓";flex:none;width:20px;height:20px;border-radius:50%;background:var(--ok);color:var(--surface);font-weight:700;font-size:12px;display:grid;place-items:center}
.note .act{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}

/* buttons */
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:11px 18px;font-weight:700;font-size:15px;line-height:1.2;transition:transform .08s ease, filter .12s ease}
.btn:hover{filter:brightness(.97)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--run-fill);border-color:var(--run-fill);color:var(--on-fill)}
.btn.tkd{background:var(--tkd-fill);border-color:var(--tkd-fill);color:var(--on-fill)}
.btn.primary:hover,.btn.tkd:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.small{padding:7px 13px;font-size:13.5px}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 auto}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.chip.done{background:var(--ok-soft);color:var(--ok)}
.chip.missed{background:var(--warn-soft);color:var(--warn)}
.chip.skipped{background:var(--surface-2);color:var(--muted);text-decoration:line-through}
.chip.today{background:var(--run-fill);color:var(--on-fill)}
.chip.next{background:var(--run-soft);color:var(--run)}
.chip.up{background:var(--surface-2);color:var(--muted)}
.chip.moved{background:var(--run-soft);color:var(--run)}

/* week strip (today) */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{background:var(--surface-2);border-radius:12px;padding:8px 2px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:66px;border:0}
.day .d{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.day .n{font-family:var(--display);font-weight:700;font-size:21px;line-height:1}
.day.is-today{background:var(--fg);color:var(--surface)}
.day.is-today .d{color:var(--surface);opacity:.7}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:8px}
.dot{width:8px;height:8px;border-radius:50%}
.dot.run{background:var(--run)}
.dot.run.open{background:transparent;border:2px solid var(--run)}
.dot.run.miss{background:transparent;border:2px solid var(--warn)}
.dot.tkd{background:var(--tkd);border-radius:3px}
.dot.tkd.open{background:transparent;border:2px solid var(--tkd)}
.dot.other{background:var(--other);border-radius:3px}
.dot.other.open{background:transparent;border:2px solid var(--other)}

/* program */
.week{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;box-shadow:var(--shadow)}
.week[data-current="true"]{border-color:var(--run);box-shadow:0 0 0 1px var(--run), var(--shadow)}
.week summary{list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 18px;cursor:pointer;border-radius:var(--r)}
.week summary::-webkit-details-marker{display:none}
.wk-no{font-family:var(--display);font-weight:800;font-style:italic;font-size:40px;line-height:.9;width:46px;text-align:center;color:var(--line)}
.week[data-current="true"] .wk-no,.week[open] .wk-no{color:var(--run)}
.wk-no small{display:block;font-size:10px;letter-spacing:.1em;color:var(--muted);font-family:var(--body);font-style:normal;font-weight:700;text-transform:uppercase;margin-bottom:3px}
.wk-t{min-width:0}
.wk-t h3{font-size:24px}
.wk-t p{font-size:14px;color:var(--muted)}
.wk-prog{display:flex;gap:5px}
.wk-prog .dot{width:10px;height:10px}
.week-body{padding:0 18px 18px;display:flex;flex-direction:column;gap:10px}
.focus{font-size:15px;color:var(--muted);max-width:65ch}
.sess{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface-2);border:0;text-align:left;width:100%;transition:background .12s ease}
.sess:hover{background:var(--run-soft)}
.sess .sd{font-size:13px;color:var(--muted);line-height:1.25}
.sess .sd b{display:block;color:var(--fg);font-family:var(--display);font-size:20px;text-transform:uppercase;font-weight:700}
.sess .mid{display:flex;flex-direction:column;gap:7px;min-width:0}
.sess .mid .t{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess .mid .t span{color:var(--muted);font-weight:400}

/* calendar */
.cal-week{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0;box-shadow:var(--shadow);scroll-margin-top:calc(env(safe-area-inset-top,0px) + 76px)}
.cal-week[data-current="true"]{border-color:var(--run);box-shadow:0 0 0 1px var(--run), var(--shadow)}
.cal-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 18px 14px;border-bottom:1px solid var(--line)}
.cal-head h3{font-size:26px;font-style:italic;font-weight:800}
.cal-head .tag{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--surface-2);color:var(--fg);border-radius:999px;padding:4px 11px}
.cal-week[data-current="true"] .cal-head .tag{background:var(--run-fill);color:var(--on-fill)}
.cal-head .tot{width:100%;font-size:14px;color:var(--muted)}
.cal-days{display:flex;flex-direction:column}
.cal-day{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:start;gap:10px;padding:10px 12px 10px 18px;border-bottom:1px solid var(--line);min-height:66px}
.cal-day:last-child{border-bottom:0}
.cal-day .dl{display:flex;flex-direction:column;align-items:flex-start;line-height:1.05;padding-top:5px}
.cal-day .dl .d{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.cal-day .dl .n{font-family:var(--display);font-size:27px;font-weight:700}
.cal-day.is-today{background:var(--surface-2);box-shadow:inset 4px 0 0 var(--run)}
.cal-day.is-today .dl .n,.cal-day.is-today .dl .d{color:var(--run)}
.cal-items{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
.item{display:flex;align-items:stretch;border:0;padding:0;background:var(--run-soft);border-radius:12px;text-align:left;overflow:hidden;min-width:0;max-width:100%;flex:1 1 100%;transition:filter .12s ease}
.item.tkd{background:var(--tkd-soft)}
.item.other{background:var(--other-soft)}
.item:hover{filter:brightness(.96)}
.item .st{width:5px;flex:none;background:var(--run)}
.item.tkd .st{background:var(--tkd)}
.item.other .st{background:var(--other)}
.item .bd{padding:8px 11px;display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.item .it{font-weight:700;font-size:15px;line-height:1.25;display:flex;gap:6px;align-items:center;min-width:0}
.item .it span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .is{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.plan{background:transparent;outline:1.5px dashed var(--tkd);outline-offset:-1.5px}
.item.plan.other{outline-color:var(--other)}
.item.plan.run{outline-color:var(--run)}
.item.plan .st{display:none}
.item.plan .bd{padding-left:13px}
.item.skip{opacity:.5}
.item.skip .it span{text-decoration:line-through}
.mark{flex:none;font-size:11px;font-weight:700;border-radius:999px;padding:0 6px;line-height:18px}
.mark.ok{background:var(--ok);color:var(--surface)}
.mark.miss{background:var(--warn);color:var(--surface)}
.add{align-self:center;border:0;background:none;white-space:nowrap;color:var(--muted);font-weight:600;font-size:14px;padding:8px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:4px}
.add:hover{color:var(--fg);background:var(--surface-2)}
.add b{font-size:18px;line-height:1;font-weight:500}
.cal-items:empty{display:none}
.cal-items:empty + .add{grid-column:2;justify-self:start}
@media (min-width:960px){
  .cal-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
  .cal-day{grid-template-columns:1fr;border-bottom:0;border-right:1px solid var(--line);padding:10px 8px;min-height:156px;align-content:start;gap:8px}
  .cal-day:last-child{border-right:0}
  .cal-day.is-today{box-shadow:inset 0 4px 0 var(--run)}
  .cal-day .dl{flex-direction:row;gap:6px;align-items:baseline;padding-top:2px}
  .cal-day .dl .n{font-size:24px}
  .cal-items{flex-direction:column;align-items:stretch;gap:6px}
  .item{flex:none}
  .item .bd{padding:7px 8px}
  .item.plan .bd{padding-left:9px}
  .item .it{font-size:13.5px}
  .item .is{font-size:12px}
  .add{justify-content:center;font-size:13px}
  .add span{display:none}
  .cal-items:empty + .add{grid-column:1;justify-self:stretch}
}

/* coach + progress */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.stat .v{font-family:var(--display);font-size:44px;font-weight:800;font-style:italic;line-height:.95}
.stat .v small{font-size:17px;font-weight:600;font-style:normal;color:var(--muted)}
.chart{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px;align-items:end;height:180px;border-bottom:1px solid var(--line);padding-top:8px}
.col{display:flex;flex-direction:column-reverse;gap:2px;height:100%;justify-content:flex-start;position:relative}
.col span{display:block;border-radius:5px 5px 0 0;min-height:0}
.col .r{background:var(--run)}
.col .k{background:var(--tkd)}
.col .p{position:absolute;inset:auto 0 0;border:1.5px dashed var(--line);border-bottom:0;border-radius:5px 5px 0 0;background:transparent}
.xlab{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px;font-size:11.5px;font-weight:600;color:var(--muted);text-align:center;margin-top:4px}
.goal{display:flex;flex-direction:column;gap:10px}
.track{height:12px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.track span{display:block;height:100%;background:linear-gradient(90deg,var(--hero-a),var(--hero-b));border-radius:999px}
.integ{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center}
.integ .ic{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--display);font-weight:700;color:var(--muted)}
.coach-out{display:flex;flex-direction:column;gap:10px;max-width:65ch;border-left:3px solid var(--run);padding-left:14px}
.coach-out p{margin:0}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:15px}
.thinking::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--run);animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.25}to{opacity:1}}
.prop{border:1.5px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:9px;min-width:0}
.prop.applied{border-color:var(--ok);background:var(--ok-soft)}
.prop.rejected{opacity:.5}
.prop .pt{font-weight:600;font-size:15px}
.gm{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:11px 0;border-top:1px solid var(--line);align-items:start}
.gm b{font-size:15px}
.gm p{grid-column:1;font-size:14px;color:var(--muted)}
.gm .v{font-family:var(--display);font-size:22px;font-weight:700;color:var(--muted);grid-row:1 / span 2;grid-column:2;align-self:center}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.flow span{background:var(--surface-2);border-radius:999px;padding:4px 11px;color:var(--fg);font-weight:600}
.rrow{display:grid;grid-template-columns:5px minmax(0,1fr) auto;gap:11px;align-items:center;background:var(--tkd-soft);border-radius:12px;padding:9px 11px 9px 0;overflow:hidden}
.rrow.other{background:var(--other-soft)}
.rrow.run{background:var(--run-soft)}
.rrow .st{align-self:stretch;background:var(--tkd)}
.rrow.other .st{background:var(--other)}
.rrow.run .st{background:var(--run)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:14px;font-weight:700}
.field input[type=date],.field input[type=number],.field input[type=text],.field textarea{font:inherit;color:var(--fg);background:var(--surface-2);border:1.5px solid transparent;border-radius:12px;padding:11px 13px;width:100%}
.field input:focus,.field textarea:focus{border-color:var(--run);background:var(--surface);outline:0}
.field textarea{min-height:74px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rpe-out{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rpe-out b{font-family:var(--display);font-size:28px;font-style:italic}
input[type=range]{width:100%;accent-color:var(--run-fill);height:28px}
.seg{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:4px;background:var(--surface-2);border-radius:999px;padding:4px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{display:grid;place-items:center;height:40px;border-radius:999px;font-weight:700;font-size:14.5px;cursor:pointer;user-select:none;color:var(--muted)}
.seg input:checked + label{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgb(0 0 0 / .14)}
.seg input:focus-visible + label{outline:2px solid var(--run)}
.wkpick{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wkpick input{position:absolute;opacity:0;pointer-events:none}
.wkpick label{display:grid;place-items:center;height:44px;border-radius:12px;background:var(--surface-2);font-weight:700;font-size:13.5px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;user-select:none;color:var(--muted)}
.wkpick input:checked + label{background:var(--run-fill);color:var(--on-fill)}
.wkpick.tkd input:checked + label{background:var(--tkd-fill)}
.wkpick input:focus-visible + label{outline:2px solid var(--run);outline-offset:2px}
.err{color:var(--warn);font-size:14px;font-weight:600}
.moverow,.inl{display:flex;gap:8px;align-items:end}
.moverow .field,.inl .field{flex:1}
.check{display:flex;gap:10px;align-items:center;font-size:15px;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--run-fill)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(5 8 16 / .55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:22px 20px 20px;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;position:relative}
.sheet::before{content:"";position:absolute;top:8px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:999px;background:var(--line)}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:24px;padding-bottom:22px}.sheet::before{display:none}}
.sheet-head{display:flex;justify-content:space-between;align-items:start;gap:12px}
.sheet-head h3{font-size:32px;font-style:italic;font-weight:800;text-transform:uppercase}
.x{border:0;background:var(--surface-2);width:36px;height:36px;border-radius:50%;font-size:20px;line-height:1;flex:none;color:var(--muted)}
hr.sep{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}

/* bottom nav */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-top:4px;padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bottomnav button{border:0;background:none;padding:6px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted)}
.bottomnav svg{width:52px;height:28px;padding:3px 15px;border-radius:999px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:background .15s ease}
.bottomnav button[aria-current="true"]{color:var(--run)}
.bottomnav button[aria-current="true"] svg{background:var(--run-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14.5px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgb(0 0 0 / .25)}
@media (min-width:960px){.toast{bottom:28px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(18px);opacity:.6}}}
@media (prefers-reduced-motion:reduce){.thinking::before{animation:none}.btn{transition:none}}

<script>
/* ---------- Ohjelmat: 8 viikkoa juoksu–kävelystä 5 km:iin ---------- */
const WU = {k:'wu', m:5}, CD = {k:'cd', m:5};
const iv = (rep, run, walk) => ({k:'iv', rep, run, walk});
const cont = m => ({k:'run', m});
const walk = m => ({k:'walk', m});
const strides = rep => ({k:'str', rep, run:1/3, walk:1});
const test5k = {k:'test', m:35};

// 2 juoksua viikossa (oletus, taekwondon rinnalla)
const PLAN2 = [
  {title:'Liikkeelle', focus:'Totutetaan jalat ja jänteet iskutukseen. Juokse niin hitaasti, että pystyt puhumaan kokonaisin lausein. Kävely on osa treeniä.',
   s:[[WU, iv(8,1,1.5), CD],[WU, iv(7,1.5,1.5), CD]]},
  {title:'Pidemmät pätkät', focus:'Juoksupätkät pitenevät kahteen ja kolmeen minuuttiin. Vauhti pysyy samana – kunto kasvaa kestosta, ei vauhdista.',
   s:[[WU, iv(6,2,1.5), CD],[WU, iv(5,3,1.5), CD]]},
  {title:'Rytmi löytyy', focus:'Neljän ja viiden minuutin juoksuja. Jos hengitys karkaa, hidasta ennemmin kuin kävele.',
   s:[[WU, iv(5,4,1.5), CD],[WU, iv(4,5,1.5), CD]]},
  {title:'Vakiinnutus', focus:'Viikko, jolla keho ehtii sopeutua. Määrä pysyy lähes samana, pisin pätkä kasvaa seitsemään minuuttiin.',
   s:[[WU, iv(4,5,1.5), CD],[WU, iv(3,7,2), CD]]},
  {title:'Kymmenen minuuttia', focus:'Iso askel: ensimmäiset yli kymmenen minuutin yhtäjaksoiset juoksut. Hitaus on sallittua ja suositeltavaa.',
   s:[[WU, iv(3,8,2), CD],[WU, iv(2,12,2), CD]]},
  {title:'Ensimmäinen 20 minuuttia', focus:'Kävelytauot vähenevät. Viikon lopuksi 20 minuuttia ilman taukoa.',
   s:[[WU, cont(15), walk(2), cont(5), CD],[WU, cont(20), CD]]},
  {title:'Kestävyys', focus:'Yhtäjaksoista juoksua 22–25 minuuttia. Nyt rakennetaan varmuutta viiden kilometrin matkalle.',
   s:[[WU, cont(22), CD],[WU, cont(25), CD]]},
  {title:'Viiden kilometrin viikko', focus:'Kevyt juoksu ja vedot alkuviikolla, viikonloppuna 5 km omaan tahtiin. Tavoite on juosta koko matka, ei aika.',
   s:[[WU, cont(15), strides(4), CD],[WU, test5k, CD]]},
];
// 3 juoksua viikossa
const PLAN3 = [
  {title:'Liikkeelle', focus:'Totutetaan jalat ja jänteet iskutukseen. Juokse niin hitaasti, että pystyt puhumaan kokonaisin lausein.',
   s:[[WU, iv(8,1,1.5), CD],[WU, iv(8,1,1.5), CD],[WU, iv(10,1,1), CD]]},
  {title:'Pidemmät pätkät', focus:'Juoksupätkät pitenevät puoleentoista ja kahteen minuuttiin. Vauhti pysyy samana.',
   s:[[WU, iv(7,1.5,1.5), CD],[WU, iv(6,2,1.5), CD],[WU, iv(6,2,1), CD]]},
  {title:'Kolmen minuutin rytmi', focus:'Ensimmäiset 3–4 minuutin juoksut. Jos hengitys karkaa, hidasta ennemmin kuin kävele.',
   s:[[WU, iv(5,3,1.5), CD],[WU, iv(5,3,1), CD],[WU, iv(4,4,1.5), CD]]},
  {title:'Vakiinnutus', focus:'Viikko, jolla keho ehtii sopeutua.',
   s:[[WU, iv(4,4,1.5), CD],[WU, iv(3,5,2), CD],[WU, iv(4,5,1.5), CD]]},
  {title:'Kymmenen minuuttia', focus:'Ensimmäiset 7–10 minuutin yhtäjaksoiset juoksut.',
   s:[[WU, iv(3,7,2), CD],[WU, iv(3,8,2), CD],[WU, iv(2,10,2), CD]]},
  {title:'Ensimmäinen 20 minuuttia', focus:'Kävelytauot vähenevät. Viikon lopuksi 20 minuuttia ilman taukoa.',
   s:[[WU, iv(2,12,2), CD],[WU, cont(15), walk(2), cont(5), CD],[WU, cont(20), CD]]},
  {title:'Kestävyys', focus:'Yhtäjaksoista juoksua 20–25 minuuttia.',
   s:[[WU, cont(20), CD],[WU, cont(25), CD],[WU, cont(25), CD]]},
  {title:'Viiden kilometrin viikko', focus:'Kevennetään alkuviikko ja juostaan lopuksi 5 km omaan tahtiin.',
   s:[[WU, cont(25), CD],[WU, cont(15), strides(4), CD],[WU, test5k, CD]]},
];
const plan = () => settings().runDays.length === 3 ? PLAN3 : PLAN2;

/* ---------- apuja ---------- */
const WD = ['ma','ti','ke','to','pe','la','su'];
const WDL = ['maanantai','tiistai','keskiviikko','torstai','perjantai','lauantai','sunnuntai'];
const WDESS = ['maanantaina','tiistaina','keskiviikkona','torstaina','perjantaina','lauantaina','sunnuntaina'];
const WDPL = ['maanantaisin','tiistaisin','keskiviikkoisin','torstaisin','perjantaisin','lauantaisin','sunnuntaisin'];
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d, 12); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const wd = s => (parse(s).getDay()+6)%7;
const fi = s => { const d = parse(s); return `${d.getDate()}.${d.getMonth()+1}.`; };
const fiLong = s => `${WD[wd(s)]} ${fi(s)}`;
const cap = s => s[0].toUpperCase() + s.slice(1);
const diffDays = (a, b) => Math.round((parse(b)-parse(a))/864e5);
const todayIso = () => iso(new Date());
const mondayOf = s => addDays(s, -wd(s));
const isDate = s => typeof s==='string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(m){
  if (m < 1) return `${Math.round(m*60)} s`;
  if (Number.isInteger(m)) return `${m} min`;
  const s = Math.round((m % 1)*60); return `${Math.floor(m)}:${pad(s)} min`;
}
const short = m => fmt(m).replace(' min','');
function segs(blocks){
  const out = [];
  for (const b of blocks){
    if (b.k==='wu'||b.k==='cd'||b.k==='walk') out.push(['walk', b.m]);
    else if (b.k==='run') out.push(['run', b.m]);
    else if (b.k==='test') out.push(['test', b.m]);
    else for (let i=0;i<b.rep;i++){ out.push([b.k==='str'?'stride':'run', b.run]); out.push(['walk', b.walk]); }
  }
  return out;
}
function totals(blocks){
  const s = segs(blocks); let total=0, run=0, longest=0;
  for (const [t,m] of s){ total+=m; if (t!=='walk'){ run+=m; longest=Math.max(longest,m);} }
  return {total:Math.round(total), run:Math.round(run), longest};
}
function steps(blocks){
  return blocks.map(b => {
    if (b.k==='wu') return {r:false, t:`${b.m} min reipas kävely – alkulämmittely`};
    if (b.k==='cd') return {r:false, t:`${b.m} min kävely ja kevyt venyttely`};
    if (b.k==='walk') return {r:false, t:`${fmt(b.m)} kävely`};
    if (b.k==='run') return {r:true, t:`${fmt(b.m)} yhtäjaksoista juoksua, keskustelutahti`};
    if (b.k==='test') return {r:true, t:`5 km juoksu omaan tahtiin (arvio 30–38 min)`};
    if (b.k==='str') return {r:true, t:`${b.rep} × 20 s reipas vedonomainen juoksu + 1 min kävely`};
    return {r:true, t:`${b.rep} × ${fmt(b.run)} juoksu + ${fmt(b.walk)} kävely`};
  });
}
function summary(blocks){
  return blocks.filter(b => b.k!=='wu' && b.k!=='cd').map(b =>
    b.k==='iv' ? `${b.rep}×${short(b.run)}′ / ${short(b.walk)}′` :
    b.k==='run' ? `${short(b.m)}′ yhtäjaksoisesti` : b.k==='test' ? '5 km' : b.k==='str' ? `${b.rep} vetoa` : `${short(b.m)}′ kävely`).join(' + ');
}
const kindOf = blocks => blocks.some(b => b.k==='test') ? '5 km' : blocks.some(b => b.k==='iv') ? 'Juoksu–kävely' : 'Kevyt juoksu';
function barHtml(blocks, size){
  const s = segs(blocks), tot = s.reduce((a,[,m])=>a+m,0) || 1;
  return `<div class="bar${size?' '+size:''}" role="img" aria-label="Treenin rakenne: ${esc(summary(blocks))}">${s.map(([t,m])=>`<span class="${t}" style="flex:${(m/tot).toFixed(4)}"></span>`).join('')}</div>`;
}
const rpeText = r => r<=2?'erittäin kevyt':r<=4?'kevyt – pystyt puhumaan':r<=6?'kohtalainen':r<=8?'raskas':'maksimaalinen';
const uid = (p='l') => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const KIND = {tkd:'Taekwondo', run:'Juoksu', other:'Muu treeni'};
const titleOf = x => x.kind==='other' ? (x.label||'Muu treeni') : x.kind==='run' ? (x.label||'Vapaa juoksu') : (x.label||'Taekwondo');

/* ---------- tila ---------- */
function defaultSettings(){
  const t = todayIso(), runDays = [2,5];
  const start = wd(t) <= runDays[0] ? mondayOf(t) : addDays(mondayOf(t), 7);
  return {startDate:start, runDays, tkdMin:75, repeats:[], dismissed:[], moves:{}, skips:{}, overrides:{}, rSkips:[],
    recurring:[1,3].map(d => ({id:`tkd-${d}`, kind:'tkd', weekday:d, minutes:75, from:mondayOf(t)}))};
}
const S = { settings:null, logs:[], view:'today', db:null, mode:'local', sheet:null, pendingDelete:null, defaults:defaultSettings(),
  sample:undefined, coach:null, coachQ:'', coachBusy:null };
const settings = () => S.settings || S.defaults;
const isDone = l => l.status !== 'planned';
const rules = () => settings().recurring || S.defaults.recurring;

function slotMap(){
  const m = [], reps = settings().repeats || [];
  plan().forEach((_, b) => { m.push(b); reps.filter(r => r===b).forEach(() => m.push(b)); });
  return m;
}
function schedule(){
  const st = settings(), P = plan(), map = slotMap(), days = [...st.runDays].sort((a,b)=>a-b), out = [];
  const moves = st.moves || {}, skips = st.skips || {}, ov = st.overrides || {};
  map.forEach((b, slot) => days.forEach((d, i) => {
    const key = `s${slot}-${i}`, orig = addDays(st.startDate, slot*7 + d);
    out.push({key, slot, base:b, idx:i, orig, date:moves[key] || orig, moved:!!moves[key], blocks: ov[key] || P[b].s[i], adjusted: !!ov[key],
      name:`Juoksu ${i+1}`, skipped:!!skips[key], done:S.logs.find(l => l.sessionKey===key && isDone(l))});
  }));
  return out;
}
const ruleActive = (r, d) => r.weekday===wd(d) && d >= (r.from||'0000') && (!r.until || d <= r.until);
function virtualsOn(d){
  const sk = settings().rSkips || [];
  return rules().filter(r => ruleActive(r, d)).map(r => ({...r, ref:`${r.id}@${d}`, date:d}))
    .filter(v => !sk.includes(v.ref) && !S.logs.some(l => l.ruleRef===v.ref));
}
const eventsOn = date => S.logs.filter(l => l.date===date && !l.sessionKey);
const tkdDoneOn = date => S.logs.filter(l => l.kind==='tkd' && l.date===date && isDone(l));
const tkdPlannedOn = date => virtualsOn(date).some(v => v.kind==='tkd') || S.logs.some(l => l.kind==='tkd' && l.date===date && !isDone(l));
function status(s, today){
  if (s.done) return ['done','Tehty'];
  if (s.skipped) return ['skipped','Ohitettu'];
  if (s.date===today) return ['today','Tänään'];
  if (s.date < today) return ['missed','Väliin'];
  return [s.moved?'moved':'up', fiLong(s.date)];
}

/* ---------- mukautuvat vinkit ---------- */
function notesFor(s, today){
  const notes = [], prev = addDays(s.date, -1);
  if (tkdDoneOn(s.date).length) notes.push(['tkd', `<b>Taekwondo samana päivänä.</b> Juokse kevyesti ennen treeniä tai siirrä juoksu toiselle päivälle.`]);
  else if (tkdPlannedOn(s.date) && s.date >= today) notes.push(['tkd', `<b>${cap(WDESS[wd(s.date)])} on myös taekwondo.</b> Juokse ensin ja rauhallisesti, tai siirrä juoksu kalenterissa.`]);
  const hard = tkdDoneOn(prev).find(l => (l.rpe||0) >= 7);
  if (hard) notes.push(['warn', `<b>Edellisenä päivänä raskas taekwondo (RPE ${hard.rpe}/10).</b> Jos jalat ovat jumissa, kävele viimeinen juoksupätkä tai lisää jokaiseen taukoon 30 s.`]);
  else if (!tkdDoneOn(prev).length && tkdPlannedOn(prev) && prev >= today) notes.push(['tkd', `Edellisenä päivänä on taekwondo. Pidä tämä juoksu keskustelutahtisena.`]);
  const runs = S.logs.filter(l => l.kind==='run' && isDone(l) && l.date < s.date).sort((a,b)=> a.date<b.date?1:-1);
  if (runs[0] && (runs[0].rpe||0) >= 8) notes.push(['warn', `<b>Edellinen juoksu tuntui raskaalta (RPE ${runs[0].rpe}).</b> Hidasta selvästi – oikea tahti tuntuu lähes liian helpolta.`]);
  else if (runs.length >= 3 && runs.slice(0,3).every(r => (r.rpe||10) <= 4)) notes.push(['ok', `Kolme viimeistä juoksua tuntuivat kevyiltä. Hyvä merkki – pysy silti ohjelmassa, jänteet sopeutuvat hitaammin kuin kunto.`]);
  if (s.adjusted) notes.push(['ok', `Valmentaja on muokannut tätä treeniä.`]);
  return notes;
}
function repeatSuggestion(today){
  const st = settings(), map = slotMap(), n = st.runDays.length;
  const cur = Math.floor(diffDays(st.startDate, today)/7);
  if (cur < 1 || cur >= map.length || (st.dismissed||[]).includes(cur-1)) return null;
  const sch = schedule();
  const prevDone = sch.filter(s => s.slot===cur-1 && s.done).length;
  const curDone = sch.filter(s => s.slot===cur && s.done).length;
  if (prevDone >= n-1 || curDone > 0) return null;
  return {slot:cur-1, base:map[cur-1], prevDone, n};
}
// Viikon toisto lisää viikon heti saman viikon perään: myöhempien viikkojen avaimet siirtyvät yhdellä.
function repeatPatch(base){
  const st = settings(), map = slotMap();
  const at = map.lastIndexOf(base) + 1;
  const shift = obj => Object.fromEntries(Object.entries(obj||{}).map(([k,v]) => {
    const m = /^s(\d+)-(\d+)$/.exec(k); return m && +m[1] >= at ? [`s${+m[1]+1}-${m[2]}`, v] : [k, v];
  }));
  return {repeats:[...(st.repeats||[]), base], moves:shift(st.moves), skips:shift(st.skips), overrides:shift(st.overrides)};
}

/* ---------- Tänään ---------- */
function weekStrip(today){
  const mon = mondayOf(today), sch = schedule();
  let h = '<div class="days">';
  for (let i=0;i<7;i++){
    const d = addDays(mon, i);
    let dots = sch.filter(s => s.date===d && !s.skipped).map(s => `<span class="dot run${s.done?'':(d<today?' miss':' open')}"></span>`).join('');
    for (const l of eventsOn(d)) dots += `<span class="dot ${l.kind}${isDone(l)?'':' open'}"></span>`;
    for (const v of virtualsOn(d)) dots += `<span class="dot ${v.kind} open"></span>`;
    h += `<button class="day${d===today?' is-today':''}" data-go="calendar" aria-label="${esc(fiLong(d))}"><span class="d">${WD[i]}</span><span class="n num">${parse(d).getDate()}</span><span class="dots">${dots}</span></button>`;
  }
  return h + '</div>';
}

/* ---------- Kalenteri ---------- */
function renderCalendar(){
  const el = document.getElementById('v-calendar'), today = todayIso(), st = settings(), map = slotMap(), P = plan();
  const sch = schedule();
  const first = mondayOf(st.startDate < today ? st.startDate : today);
  const progEnd = addDays(st.startDate, map.length*7 - 1);
  const lastDate = [progEnd, today, ...sch.map(s => s.date), ...S.logs.map(l => l.date)].reduce((a,b)=> b>a?b:a);
  const lastMon = mondayOf(lastDate);
  let h = `<div class="view-head"><div><span class="label">Napauta treeniä muokataksesi, siirtääksesi tai ohittaaksesi</span><h2>Kalenteri</h2></div>
    <div class="legend"><span><i style="background:var(--run)"></i>Juoksu</span><span><i style="background:var(--tkd)"></i>Taekwondo</span><span><i style="background:var(--other)"></i>Muu</span></div></div>`;
  for (let mon = first; mon <= lastMon; mon = addDays(mon, 7)){
    const sun = addDays(mon, 6), slot = Math.floor(diffDays(st.startDate, mon)/7);
    const inProg = slot >= 0 && slot < map.length;
    const weekRuns = sch.filter(s => s.date>=mon && s.date<=sun && !s.skipped);
    const planned = weekRuns.reduce((a,s)=>a+totals(s.blocks).run,0);
    const tkdCount = [...Array(7)].map((_,i)=>addDays(mon,i)).filter(d => tkdDoneOn(d).length || tkdPlannedOn(d)).length;
    const isCur = today>=mon && today<=sun;
    h += `<section class="cal-week" data-current="${isCur}"${isCur?' id="cal-current"':''}>
      <div class="cal-head"><h3>${fi(mon)}–${fi(sun)}</h3>${inProg?`<span class="tag">Viikko ${slot+1}</span><span class="muted small">${esc(P[map[slot]].title)}</span>`:''}
      <span class="tot num">Juoksua ${planned} min${tkdCount?` · taekwondo ${tkdCount}×`:''}</span></div><div class="cal-days">`;
    for (let i=0;i<7;i++){
      const d = addDays(mon, i);
      let items = '';
      for (const s of sch.filter(s => s.date===d)){
        const t = totals(s.blocks);
        const mk = s.done ? '<span class="mark ok">✓</span>' : (!s.skipped && d<today) ? '<span class="mark miss">!</span>' : '';
        items += `<button class="item run${s.skipped?' skip':''}" data-act="session" data-key="${s.key}"><span class="st"></span><span class="bd"><span class="it">${mk}<span>${esc(kindOf(s.blocks))}</span></span><span class="is">${t.total} min · ${esc(summary(s.blocks))}${s.moved?' · siirretty':''}${s.adjusted?' · muokattu':''}</span>${barHtml(s.blocks,'thin')}</span></button>`;
      }
      for (const l of eventsOn(d)){
        const done = isDone(l);
        items += `<button class="item ${l.kind}${done?'':' plan'}" data-act="event" data-id="${l.id}"><span class="st"></span><span class="bd"><span class="it">${done?'<span class="mark ok">✓</span>':''}<span>${esc(titleOf(l))}</span></span><span class="is">${l.minutes||'–'} min${done&&l.rpe?` · RPE ${l.rpe}`:done?'':' · suunniteltu'}</span></span></button>`;
      }
      for (const v of virtualsOn(d)) items += `<button class="item ${v.kind} plan" data-act="virt" data-ref="${v.ref}"><span class="st"></span><span class="bd"><span class="it"><span>${esc(titleOf(v))}</span></span><span class="is">${v.minutes} min · ${d<today?'kirjaamatta':'toistuva'}</span></span></button>`;
      const addBtn = `<button class="add" data-act="add" data-date="${d}" aria-label="Lisää treeni ${esc(fiLong(d))}"><b>+</b><span>Lisää</span></button>`;
      h += `<div class="cal-day${d===today?' is-today':''}"><div class="dl"><span class="d">${WD[i]}</span><span class="n num">${parse(d).getDate()}</span></div><div class="cal-items">${items}</div>${addBtn}</div>`;
    }
    h += `</div></section>`;
  }
  el.innerHTML = h;
}

  el.innerHTML = h;
}

function propHtml(p, i){
  const s = p.key ? schedule().find(x => x.key===p.key) : null;
  let what = '';
  if (p.type==='replace' && s) what = `${esc(fiLong(s.date))}: ${esc(summary(s.blocks))} → <b>${esc(summary(p.blocks))}</b> (${totals(p.blocks).total} min)`;
  else if (p.type==='move' && s) what = `${esc(kindOf(s.blocks))} ${esc(fiLong(s.date))} → <b>${esc(fiLong(p.date))}</b>`;
  else if (p.type==='skip' && s) what = `Ohita ${esc(kindOf(s.blocks).toLowerCase())} ${esc(fiLong(s.date))}`;
  else if (p.type==='repeat_week') what = `Toista ohjelman viikko ${p.week} (”${esc(plan()[slotMap()[p.week-1]]?.title||'')}”)`;
  const st = p.status;
  return `<div class="prop${st?' '+st:''}"><span class="pt">${what}</span>${p.type==='replace'?barHtml(p.blocks):''}<span class="small muted">${esc(p.reason||'')}</span>
    ${st==='applied'?'<span class="chip done">Hyväksytty</span>':st==='rejected'?'<span class="chip skipped">Hylätty</span>':
    `<div class="btnrow"><button class="btn small primary" data-act="prop-ok" data-i="${i}">Hyväksy</button><button class="btn small ghost" data-act="prop-no" data-i="${i}">Hylkää</button></div>`}</div>`;
}
function coachPrompt(q){
  const today = todayIso(), st = settings(), map = slotMap();
  const sch = schedule().sort((a,b)=> a.date<b.date?-1:1);
  const runs = sch.filter(s => s.date >= addDays(today,-21)).slice(0, 14).map(s => {
    const [, l] = status(s, today);
    return `${s.key} | ${s.date} (${WD[wd(s.date)]}) | ohjelman vk ${s.slot+1} | ${l}${s.done?` (RPE ${s.done.rpe}, ${s.done.minutes} min${s.done.note?`, "${s.done.note}"`:''})`:''} | ${summary(s.blocks)} | ${totals(s.blocks).total} min`;

Vastaa VAIN JSON-objektina tässä muodossa:
{"analysis": "2–4 lyhyttä kappaletta tavallista tekstiä, kappaleet erotettu rivinvaihdolla, ei markdownia",
 "proposals": [
  {"type":"replace","key":"s2-0","blocks":[{"k":"wu","m":5},{"k":"iv","rep":5,"run":2,"walk":1.5},{"k":"cd","m":5}],"reason":"lyhyt perustelu"},

  {"type":"skip","key":"s1-1","reason":"..."},
  {"type":"repeat_week","week":2,"reason":"..."}
 ]}
Lohkotyypit: wu = alkukävely (m min), cd = loppukävely (m min), walk = kävely (m), run = yhtäjaksoinen juoksu (m), iv = toistot (rep kertaa: run min juoksua + walk min kävelyä). Minuutit voivat olla desimaaleja (1.5 = 1:30). Enintään 3 ehdotusta; tyhjä lista, jos muutoksia ei tarvita. Käytä vain yllä listattuja avaimia.`;
}
function validBlocks(bl){
  if (!Array.isArray(bl) || !bl.length || bl.length > 8) return null;
  const num = (v, lo, hi) => { const n = +v; return Number.isFinite(n) && n >= lo && n <= hi ? Math.round(n*4)/4 : null; };
  const out = [];
  for (const b of bl){
    if (!b || typeof b!=='object') return null;
    if (['wu','cd','walk','run'].includes(b.k)){ const m = num(b.m, 0.25, 60); if (m===null) return null; out.push({k:b.k, m}); }
    else if (b.k==='iv'){ const rep = Math.round(+b.rep), run = num(b.run, 0.25, 30), w = num(b.walk, 0.25, 5); if (!(rep>=1&&rep<=20) || run===null || w===null) return null; out.push({k:'iv', rep, run, walk:w}); }
    else return null;
  }
  return out;
}
function cleanProposals(list){
  const today = todayIso(), sch = schedule(), map = slotMap(), out = [];
  for (const p of (Array.isArray(list) ? list : []).slice(0,3)){
    if (!p || typeof p!=='object') continue;
    const reason = String(p.reason||'').slice(0,300);
    if (p.type==='repeat_week'){ const w = Math.round(+p.week); if (w>=1 && w<=map.length) out.push({type:'repeat_week', week:w, reason}); continue; }
    const s = sch.find(x => x.key===p.key);
    if (!s || s.done || s.date < today) continue;
    if (p.type==='replace'){ const bl = validBlocks(p.blocks); if (bl) out.push({type:'replace', key:s.key, blocks:bl, reason}); }
    else if (p.type==='move' && isDate(p.date) && p.date >= today) out.push({type:'move', key:s.key, date:p.date, reason});
    else if (p.type==='skip') out.push({type:'skip', key:s.key, reason});
  }
  return out;
}
let coachCtl = null;
async function runCoach(){
  if (!S.sample || S.coachBusy) return;
  const q = S.coachQ.trim();
  coachCtl = new AbortController();
  S.coachBusy = true; render();
  try {
    const res = await S.sample.json(coachPrompt(q), {signal: coachCtl.signal, cache:false});
    const analysis = String(res && res.analysis || '').slice(0, 4000);
    if (!analysis) throw {code:'invalid_json'};
    S.coach = {analysis, proposals: cleanProposals(res.proposals), at: new Date().toISOString(), q};
    S.coachQ = '';
    await saveCoach();
  } catch(e){
    const code = e && e.code;
    if (code==='cancelled'){ /* käyttäjä pysäytti */ }
    else if (code==='not_granted' || code==='sampling_disabled' || code==='not_declared' || code==='capability_disabled' || code==='capability_removed'){ S.sample = null; }
    else S.coach = {...(S.coach||{}), error: code==='rate_limited' ? 'Claudea on käytetty juuri paljon. Yritä hetken päästä uudelleen.'
      : code==='invalid_json' ? 'Valmentajan vastausta ei saatu luettua. Yritä uudelleen.' : 'Valmentaja ei vastannut. Yritä uudelleen.'};
  } finally { S.coachBusy = false; coachCtl = null; render(); }
}
async function saveCoach(){
  const c = {...S.coach}; delete c.error;
  if (S.mode==='db' && S.db){ try { await S.db.doc('coach/last').set(c); } catch(e){} }
  else { try { localStorage.setItem(LS+'.coach', JSON.stringify(c)); } catch(e){} }
}
async function applyProposal(i, ok){
  S.coach = JSON.parse(JSON.stringify(S.coach));
  const p = S.coach.proposals[i]; if (!p || p.status) return;
  if (ok){
    const st = settings();
    const s = p.key ? schedule().find(x => x.key===p.key) : null;
    if (p.type==='replace' && s) await saveSettings({overrides:{...(st.overrides||{}), [p.key]:p.blocks}});
    else if (p.type==='move' && s) await saveSettings({moves:{...(st.moves||{}), [p.key]:p.date}});
    else if (p.type==='skip' && s) await saveSettings({skips:{...(st.skips||{}), [p.key]:true}});
    else if (p.type==='repeat_week'){ const base = slotMap()[p.week-1]; if (base!==undefined) await saveSettings(repeatPatch(base)); }
    else { toast('Ehdotus ei ole enää ajankohtainen'); }
    // Viikon toisto siirtää myöhempiä avaimia: hylätään muut vielä avoimet ehdotukset, jotta ne eivät osu väärään treeniin.
    if (p.type==='repeat_week') S.coach.proposals.forEach((x, j) => { if (j!==i && !x.status) x.status = 'rejected'; });
  }
  S.coach.proposals = S.coach.proposals.map((x, j) => j===i ? {...x, status: ok ? 'applied' : 'rejected'} : x);
  await saveCoach(); toast(ok ? 'Muutos tehty ohjelmaan' : 'Ehdotus hylätty'); render();
}

    sync();
  });
  document.getElementById('f-date').addEventListener('input', sync);
  sync();
  f.addEventListener('submit', onLogSubmit);
}

/* ---------- tallennus ---------- */
const LS = 'askel5k.v3';
function loadLocal(){ try { const j = JSON.parse(localStorage.getItem(LS)||'null'); if (j){ S.settings = j.settings||null; S.logs = j.logs||[]; }
  const c = JSON.parse(localStorage.getItem(LS+'.coach')||'null'); if (c) S.coach = c; } catch(e){} }
function saveLocal(){ try { localStorage.setItem(LS, JSON.stringify({settings:S.settings, logs:S.logs})); } catch(e){} }

async function saveSettings(patch){
  S.settings = {...settings(), ...patch};
  if (!S.settings.recurring) S.settings.recurring = rules();
  if (S.mode==='db' && S.db){ try { await S.db.doc('settings/main').set(S.settings); } catch(e){ toast('Tallennus epäonnistui. Yritä uudelleen.'); } }
  else saveLocal();
}
async function ensureSettings(){ if (!S.settings || !S.settings.recurring) await saveSettings({}); }
async function putLog(entry){
  await ensureSettings();
  if (S.mode==='db' && S.db){
    try { await S.db.collection('log').doc(entry.id).set(entry); }
    catch(e){ toast(e && e.code==='quota_exceeded' ? 'Tallennustila on täynnä. Poista vanhoja kirjauksia.' : 'Tallennus epäonnistui. Yritä uudelleen.'); return false; }
  } else { S.logs = S.logs.filter(l => l.id!==entry.id).concat(entry); saveLocal(); }
  return true;
}
async function removeLog(id){
  if (S.mode==='db' && S.db){ try { await S.db.collection('log').doc(id).delete(); } catch(e){ toast('Poisto epäonnistui.'); } }
  else { S.logs = S.logs.filter(l => l.id!==id); saveLocal(); }
}

async function onLogSubmit(ev){
  ev.preventDefault();
  const sh = S.sheet, err = document.getElementById('f-err'), today = todayIso();
  const date = document.getElementById('f-date').value, minutes = +document.getElementById('f-min').value;
  if (!date || !(minutes>0)){ err.textContent = 'Anna päivä ja kesto minuutteina.'; err.hidden = false; return; }
  const future = date > today;
  if (future && sh.doneOnly){ err.textContent = 'Tehdyksi merkityn treenin päivä ei voi olla tulevaisuudessa.'; err.hidden = false; return; }
  const prev = sh.id ? S.logs.find(l => l.id===sh.id) : null;
  const kind = prev ? prev.kind : sh.key ? 'run' : sh.type || 'tkd';
  let status;
  if (future) status = 'planned';
  else if (sh.edit) status = prev ? prev.status || 'done' : 'planned';
  else status = 'done';
  const entry = {...(prev||{}), id: prev ? prev.id : uid(), kind, date, minutes, note: document.getElementById('f-note').value.trim(), status, createdAt: prev ? prev.createdAt : Date.now()};
  if (status==='done') entry.rpe = +document.getElementById('f-rpe').value; else delete entry.rpe;
  const km = document.getElementById('f-km'); if (km && km.value && status==='done') entry.km = +String(km.value).replace(',','.'); else delete entry.km;
  const lab = document.getElementById('f-label'); if (kind==='other' && lab && lab.value.trim()) entry.label = lab.value.trim();
  if (sh.key) entry.sessionKey = sh.key;
  if (sh.ref) entry.ruleRef = sh.ref;
  const rep = document.getElementById('f-rep');
  if (rep && rep.checked){
    const rule = {id: uid('r'), kind, weekday: wd(date), minutes, from: date};
    if (entry.label) rule.label = entry.label;
    await saveSettings({recurring:[...rules(), rule]});
    if (!future){ entry.ruleRef = `${rule.id}@${date}`; await putLog(entry); }
    closeSheet(); toast(`${titleOf(rule)} toistuu ${WDPL[rule.weekday]}`); return render();
  }
  if (await putLog(entry)){
    closeSheet();
    toast(sh.edit ? 'Muutokset tallennettu' : future ? `${KIND[kind]} lisätty kalenteriin` : kind==='tkd' ? 'Taekwondo kirjattu' : sh.key ? 'Juoksu merkitty tehdyksi' : 'Treeni kirjattu');
    render();
  }
}

let toastT;
function toast(msg){ const r = document.getElementById('toast-root'); r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toastT); toastT = setTimeout(()=>{ r.innerHTML=''; }, 2600); }

/* ---------- tapahtumat ---------- */
const mvDate = () => (document.getElementById('mv-date')||{}).value;
document.addEventListener('input', e => { if (e.target.id==='c-q'){ S.coachQ = e.target.value; const b = document.querySelector('[data-act="coach-run"]'); if (b) b.textContent = S.coachQ.trim() ? 'Kysy valmentajalta' : 'Analysoi tilanne'; } });
document.addEventListener('click', async ev => {
  const go = ev.target.closest('[data-go]');
  if (go){
    S.view = go.dataset.go; S.pendingDelete = null; render();
    const c = S.view==='calendar' && document.getElementById('cal-current');
    if (c) c.scrollIntoView({block:'start'}); else window.scrollTo({top:0});
    return;
  }
  const a = ev.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, st = settings(), today = todayIso();
  if (act==='scrim'){ if (ev.target===a) closeSheet(); return; }
  if (act==='close') return closeSheet();
  if (act==='session') return openSheet('session', {key:a.dataset.key});
  if (act==='event') return openSheet('event', {id:a.dataset.id});
  if (act==='virt') return openSheet('virt', {ref:a.dataset.ref});
  if (act==='complete') return openSheet('form', {key:a.dataset.key, type:'run'});
  if (act==='complete-event'){ const l = S.logs.find(x => x.id===a.dataset.id); return openSheet('form', {id:l.id, type:l.kind, date: l.date > today ? today : l.date}); }
  if (act==='edit-event'){ const l = S.logs.find(x => x.id===a.dataset.id); return openSheet('form', {id:l.id, type:l.kind, edit:true}); }
  if (act==='edit-virt'){ const v = findVirt(a.dataset.ref); return openSheet('form', {ref:v.ref, type:v.kind, date:v.date, lock:true, edit:true}); }
  if (act==='add') return openSheet('form', {date:a.dataset.date, type:a.dataset.kind || 'tkd', lock:!!a.dataset.lock, ref:a.dataset.ref});
  if (act==='del'){
    if (S.pendingDelete===a.dataset.id){ S.pendingDelete=null; await removeLog(a.dataset.id); toast('Poistettu'); if (S.sheet && S.sheet.kind==='event') S.sheet=null; }
    else S.pendingDelete = a.dataset.id;
    return render();
  }
  if (act==='move-session'){
    const d = mvDate(); if (!d) return;
    const s = schedule().find(x => x.key===a.dataset.key), moves = {...(st.moves||{})};
    if (d===s.orig) delete moves[s.key]; else moves[s.key] = d;
    await saveSettings({moves}); closeSheet(); toast(`Juoksu siirretty: ${fiLong(d)}`); return render();
  }
  if (act==='unmove'){ const moves = {...(st.moves||{})}; delete moves[a.dataset.key]; await saveSettings({moves}); closeSheet(); toast('Juoksu palautettu'); return render(); }
  if (act==='unoverride'){ const ov = {...(st.overrides||{})}; delete ov[a.dataset.key]; await saveSettings({overrides:ov}); closeSheet(); toast('Alkuperäinen treeni palautettu'); return render(); }
  if (act==='skip'){ await saveSettings({skips:{...(st.skips||{}), [a.dataset.key]:true}}); closeSheet(); toast('Treeni ohitettu'); return render(); }
  if (act==='unskip'){ const skips = {...(st.skips||{})}; delete skips[a.dataset.key]; await saveSettings({skips}); closeSheet(); return render(); }
  if (act==='move-event'){
    const d = mvDate(); if (!d) return; const l = S.logs.find(x => x.id===a.dataset.id);
    if (await putLog({...l, date:d})){ closeSheet(); toast(`Siirretty: ${fiLong(d)}`); render(); } return;
  }
  if (act==='skip-virt'){ await saveSettings({rSkips:[...(st.rSkips||[]), a.dataset.ref]}); closeSheet(); toast('Poistettu tältä kerralta'); return render(); }
  if (act==='move-virt'){
    const d = mvDate(), v = findVirt(a.dataset.ref); if (!d || !v || d===v.date) return;
    await putLog({id:uid(), kind:v.kind, label:v.label, date:d, minutes:v.minutes, note:'', status:'planned', ruleRef:v.ref, createdAt:Date.now()});
    closeSheet(); toast(`${titleOf(v)} siirretty: ${fiLong(d)}`); return render();
  }
  if (act==='rule-min'){
    const m = +(document.getElementById('r-min')||{}).value; if (!(m>0)) return;
    await saveSettings({recurring: rules().map(r => r.id===a.dataset.id ? {...r, minutes:m} : r)});
    closeSheet(); toast('Kesto päivitetty kaikille tuleville kerroille'); return render();
  }
  if (act==='rule-end'){
    if (S.pendingDelete!==a.dataset.id){ S.pendingDelete = a.dataset.id; return S.sheet ? renderSheet() : render(); }
    const until = addDays(a.dataset.from || today, -1);
    await saveSettings({recurring: rules().map(r => r.id===a.dataset.id ? {...r, until} : r)});
    S.pendingDelete = null; closeSheet(); toast('Toisto lopetettu'); return render();
  }
  if (act==='repeat'){ await saveSettings(repeatPatch(+a.dataset.base)); toast('Viikko lisätty uudelleen ohjelmaan'); return render(); }
  if (act==='dismiss'){ await saveSettings({dismissed:[...(st.dismissed||[]), +a.dataset.slot]}); return render(); }
  if (act==='clear-repeats'){ await saveSettings({repeats:[]}); toast('Toistot poistettu'); return render(); }
  if (act==='clear-moves'){ await saveSettings({moves:{}}); toast('Juoksut palautettu'); return render(); }
  if (act==='clear-overrides'){ await saveSettings({overrides:{}}); toast('Alkuperäiset juoksut palautettu'); return render(); }
  if (act==='coach-run') return runCoach();
  if (act==='coach-stop'){ if (coachCtl) coachCtl.abort(); return; }
  if (act==='prop-ok') return applyProposal(+a.dataset.i, true);
  if (act==='prop-no') return applyProposal(+a.dataset.i, false);
});
document.addEventListener('keydown', e => { if (e.key==='Escape' && S.sheet) closeSheet(); });
document.addEventListener('change', e => {
  if (e.target.name!=='p-n') return;
  const def = +e.target.value===3 ? [0,2,5] : [2,5];
  document.querySelectorAll('input[name="p-run"]').forEach(i => { i.checked = def.includes(+i.value); });
});
document.addEventListener('submit', async ev => {
  if (ev.target.id!=='prefs-form') return;
  ev.preventDefault();
  const n = +(document.querySelector('input[name="p-n"]:checked')||{}).value || 2;
  const runDays = [...document.querySelectorAll('input[name="p-run"]:checked')].map(i=>+i.value);
  const err = document.getElementById('p-err');
  if (runDays.length!==n){ err.textContent = `Valitse ${n} juoksupäivää (nyt ${runDays.length}).`; err.hidden=false; return; }
  const start = document.getElementById('p-start').value;
  if (!start){ err.textContent = 'Valitse aloituspäivä.'; err.hidden=false; return; }
  const changed = n !== settings().runDays.length;
  await saveSettings({startDate: mondayOf(start), runDays, tkdMin: +document.getElementById('p-tkdmin').value || 75, ...(changed?{moves:{}, skips:{}, repeats:[], overrides:{}}:{})});
  toast('Asetukset tallennettu'); render();
});

/* ---------- render ---------- */
const wide = matchMedia('(min-width: 960px)');
function render(){
  const v = S.view, right = wide.matches ? (v==='today' ? 'calendar' : v) : v;
  for (const id of ['today','calendar','plan','coach','prefs']){
    document.getElementById('v-'+id).hidden = wide.matches ? !(id==='today' || id===right) : id!==v;
  }
  document.querySelectorAll('nav [data-go]').forEach(b => b.setAttribute('aria-current', String(b.dataset.go===(b.closest('#topnav') ? right : v))));
  const focusQ = document.activeElement && document.activeElement.id==='c-q';
  renderToday(); renderCalendar(); renderPlan(); renderCoach(); renderPrefs();
  if (focusQ){ const q = document.getElementById('c-q'); if (q){ q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
  if (S.sheet) renderSheet();
  document.getElementById('sync').textContent = S.mode==='db' ? 'Tallentuu tilillesi' : S.mode==='connecting' ? 'Yhdistetään…' : 'Vain tämä selain';
}
wide.addEventListener('change', render);

/* ---------- käynnistys ---------- */
loadLocal();
S.mode = window.claude ? 'connecting' : 'local';
if (!window.claude) S.sample = null;
render();
(async () => {
  try { S.sample = window.claude ? await window.claude.use('sample') : null; } catch(e){ S.sample = null; }
  render();
})();
(async () => {
  let db = null;
  try { db = window.claude ? await window.claude.use('db') : null; } catch(e){ db = null; }
  if (!db){ S.mode='local'; return render(); }
  S.db = db; S.mode = 'db';
  let got = false;
  const timer = setTimeout(() => { if (!got) document.getElementById('sync').textContent = 'Tietoja ei saatu vielä haettua'; }, 10000);
  db.collection('log').onSnapshot(snap => {
    S.logs = snap.docs.map(d => d.data()); got = true; if (!snap.metadata.fromCache) clearTimeout(timer); render();
  }, () => { clearTimeout(timer); toast('Kirjauksia ei voitu ladata.'); });
  db.doc('settings/main').onSnapshot(snap => { S.settings = snap.exists ? snap.data() : null; render(); }, () => {});
  db.doc('coach/last').onSnapshot(snap => { if (snap.exists && !S.coachBusy) { S.coach = snap.data(); render(); } }, () => {});
})();
</script>
